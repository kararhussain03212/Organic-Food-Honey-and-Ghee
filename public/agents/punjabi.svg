      <stop offset="0%" style="stop-color:#496348;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d4f39;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="240" height="240" fill="url(#bgPunjabi)"/>

